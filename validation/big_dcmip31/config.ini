[Grid]
grid_type = cubed_sphere
lambda0 = 0.0
phi0 = 0.0
alpha0 = 0.0

ztop = 10000.0

[Test_case]
equations = Euler
depth_approx = shallow

case_number = 31

[Time_integration]
dt = 14.5
t_end = 1800
time_integrator = epi_stiff5
tolerance = 1e-8

verbose_solver = 1
gmres_restart = 200
exponential_solver = kiops

[Spatial_discretization]
num_solpts = 5
num_elements_horizontal = 144
num_elements_vertical = 20

[Output_options]
stat_freq = 0
output_freq = 0
save_state_freq = 125
store_solver_stats = 0
output_dir = tests/data/temp
