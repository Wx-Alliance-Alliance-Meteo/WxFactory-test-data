[Grid]
grid_type = cubed_sphere
lambda0 = 0.0
phi0 = 0.0
#ϕ0 = 0.7853981633974483
alpha0 = 0.0

ztop = 20000.0

[Test_case]
equations = Euler
depth_approx = shallow
case_number = 21

[Time_integration]

# Time step
dt = 3.5

# End time of the simulation in sec
#t_end = 0
t_end = 2400
#t_end = 36000
#t_end = 450000

# Time integration scheme
time_integrator = epi_stiff5

# Solver tolerance
tolerance = 1e-7

verbose_solver = 1
gmres_restart = 200
exponential_solver = kiops

[Spatial_discretization]

# The grid will have (num_solpts) x (num_solpts) nodal points in each elements.
num_solpts = 5

# Number of element in x^1, x^2 and x^3 directions
num_elements_horizontal = 6
num_elements_vertical = 6

#filter_apply = 1
#filter_order  = 2

[Output_options]
stat_freq = 0
output_freq = 1
save_state_freq = 1
store_solver_stats = 0
output_dir = tests/data/temp
output_format = netcdf

[Post_processing]
enable_schar_mountain = 1
schar_mountain_longitude = pi / 4
schar_mountain_lattitude = 0
schar_mountain_height = 250
schar_mountain_radius = 5000
schar_mountain_length = 4000
schar_mountain_step = 340 # around 1200 secondes
