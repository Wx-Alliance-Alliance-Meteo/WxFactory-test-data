# Integration test: start an Euler simulation from an ERA5 zarr file.
#
# Based on config/ERA5_euler.ini, but with a smaller grid and a reduced ERA5
# dataset (single timestep, 1 deg, only the features used by the model). The
# input data lives in this directory (see era5_2020-07-01_1deg and
# topography.fst).
#
# The reference state vector is generated by running this config with
# save_state_freq = 1; the resulting state file is stored alongside this config
# and compared against by the integration test.

[Grid]
grid_type = cubed_sphere
lambda0 = 0.0
phi0 = 0.0
alpha0 = 0.0
ztop = 10000

[Test_case]
equations = euler

# Reduced ERA5 dataset (single timestep, 1 deg, 65 features) in the test data dir.
initial_conditions = tests/data/integration/small_era5/era5_2020-07-01_1deg
time_start = 2020-07-01
topography_file = tests/data/integration/small_era5/topography.fst

[Time_integration]
dt = 18
t_end = 18

time_integrator = epi3
exponential_solver = pmex
tolerance = 1e-7
gmres_restart = 20
starting_step = 0

[Spatial_discretization]
num_solpts = 3
num_elements_horizontal = 6
num_elements_vertical = 4

[Output_options]
stat_freq = 0
output_freq = 0
save_state_freq = 1
store_solver_stats = 0
output_dir = tests/data/temp
output_format = netcdf
